name: navabi
description: 'navabi is an online retailer specializing in plus-size designer fashion
  for women, founded and headquartered in Aachen, Germany. As of July 2026 only the
  Canadian storefront (navabi.ca) is live: navabi.com now redirects to an unrelated
  parked domain (gitinama.site) and navabi.de returns a maintenance page, indicating
  the brand has largely wound down its international operations. The shop curates dresses,
  tops, jackets, jeans, coats, swimwear and accessories from luxury and contemporary
  labels such as Anna Scholz, Basler, Bogner, Lacoste, Roberto Cavalli and Zizzi,
  alongside styling advice, a fashion magazine and an affiliate program. navabi was
  surfaced as a portfolio company of Index Ventures and added to the API Evangelist
  network for enrichment. It is a consumer e-commerce brand with no public developer
  portal, API, well-known discovery surface, or published security program; enrichment
  probes captured only its web/domain security posture (navabi.ca).'
